<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Detail – FairJobs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">FairJobs</div>
    <nav>
      <a href="index.html">Jobs</a>
      <a href="post.html">Post a Job</a>
    </nav>
  </header>

  <div class="container">
    <p><a href="index.html">← Back to all jobs</a></p>

    <div id="job-detail" class="job-detail">
      <p>Loading job...</p>
    </div>

    <!-- Apply form -->
    <div class="job-detail" style="margin-top: 24px;">
      <h2>Apply for this job</h2>
      <p>We show a confirmation right away so you are not left in the dark.</p>

      <div id="apply-success" class="success-message"></div>
      <div id="apply-error" class="error-message"></div>

      <form id="apply-form">
        <input type="hidden" id="job_id" name="job_id">

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="resume">Resume link or short summary</label>
          <input type="text" id="resume" name="resume" placeholder="LinkedIn, Google Drive link, or paste a short summary">
        </div>

        <div class="form-group">
          <label for="message">Short message (optional)</label>
          <textarea id="message" name="message" placeholder="Why you're a good fit..."></textarea>
        </div>

        <button type="submit" class="btn btn-block">Submit Application</button>
      </form>
    </div>
  </div>

  <footer>
    FairJobs MVP – Built with simple HTML, CSS, JS & PHP for learning.
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initJobDetailPage);
  </script>
</body>
</html>
