<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job – FairJobs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">FairJobs</div>
    <nav>
      <a href="index.html">Jobs</a>
      <a href="post.html">Post a Job</a>
    </nav>
  </header>

  <div class="container">
    <h1>Post a new job</h1>
    <p class="subtitle">Salary is required. This keeps listings transparent. (Demo – posts may not permanently save on Vercel)</p>

    <div id="post-success" class="success-message"></div>
    <div id="post-error" class="error-message"></div>

    <form id="post-form" class="job-detail">
      <div class="form-group">
        <label for="title">Job Title *</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="company">Company *</label>
        <input type="text" id="company" name="company" required>
      </div>

      <div class="form-group">
        <label for="location">Location *</label>
        <input type="text" id="location" name="location" placeholder="e.g. Remote (US) or Berlin, Germany" required>
      </div>

      <div class="form-group">
        <label for="remote">Remote? *</label>
        <select id="remote" name="remote" required>
          <option value="yes">Fully Remote</option>
          <option value="hybrid">Hybrid</option>
          <option value="no">On-site</option>
        </select>
      </div>

      <div class="form-group">
        <label for="salary_min">Salary Min *</label>
        <input type="number" id="salary_min" name="salary_min" required min="0">
      </div>

      <div class="form-group">
        <label for="salary_max">Salary Max *</label>
        <input type="number" id="salary_max" name="salary_max" required min="0">
      </div>

      <div class="form-group">
        <label for="currency">Currency</label>
        <input type="text" id="currency" name="currency" value="USD">
      </div>

      <div class="form-group">
        <label for="type">Job Type</label>
        <select id="type" name="type">
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
          <option value="Contract">Contract</option>
          <option value="Internship">Internship</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" name="description" required></textarea>
      </div>

      <div class="form-group">
        <label for="requirements">Requirements</label>
        <textarea id="requirements" name="requirements"></textarea>
      </div>

      <button type="submit" class="btn btn-block">Post Job</button>
    </form>
  </div>

  <footer>
    FairJobs MVP – Built with simple HTML, CSS, JS & PHP for learning.
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initPostPage);
  </script>
</body>
</html>
